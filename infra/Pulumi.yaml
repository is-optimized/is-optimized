name: is-optimized
runtime: yaml
description: Reviewed GCP deployment definition; preview/apply require separate authorization.
config:
  project:
    type: string
  region:
    type: string
    default: us-central1
  zone:
    type: string
    default: us-central1-a
  domain:
    type: string
  imageArchive:
    type: string
  instanceCount:
    type: integer
    default: 1
  machineType:
    type: string
    default: e2-small
resources:
  provider:
    type: pulumi:providers:gcp
    properties:
      project: ${project}
      region: ${region}
      zone: ${zone}
    options:
      version: 10.2.0
  network:
    type: gcp:compute:Network
    properties:
      autoCreateSubnetworks: false
    options:
      provider: ${provider}
  subnet:
    type: gcp:compute:Subnetwork
    properties:
      network: ${network.id}
      region: ${region}
      ipCidrRange: 10.42.0.0/24
      privateIpGoogleAccess: true
    options:
      provider: ${provider}
  router:
    type: gcp:compute:Router
    properties:
      network: ${network.id}
      region: ${region}
    options:
      provider: ${provider}
  nat:
    type: gcp:compute:RouterNat
    properties:
      router: ${router.name}
      region: ${region}
      natIpAllocateOption: AUTO_ONLY
      sourceSubnetworkIpRangesToNat: ALL_SUBNETWORKS_ALL_IP_RANGES
    options:
      provider: ${provider}
  serviceAccount:
    type: gcp:serviceaccount:Account
    properties:
      accountId: is-optimized-runtime
      displayName: is-optimized Nanos runtime
    options:
      provider: ${provider}
  database:
    type: gcp:firestore:Database
    properties:
      name: (default)
      locationId: ${region}
      type: FIRESTORE_NATIVE
      deleteProtectionState: DELETE_PROTECTION_ENABLED
    options:
      provider: ${provider}
      protect: true
  databaseAccess:
    type: gcp:projects:IAMMember
    properties:
      project: ${project}
      role: roles/datastore.user
      member: serviceAccount:${serviceAccount.email}
    options:
      provider: ${provider}
  pendingIndex:
    type: gcp:firestore:Index
    properties:
      database: ${database.name}
      collection: records
      fields:
        - fieldPath: kind
          order: ASCENDING
        - fieldPath: state
          order: ASCENDING
    options:
      provider: ${provider}
  reports:
    type: gcp:storage:Bucket
    properties:
      location: ${region}
      uniformBucketLevelAccess: true
      publicAccessPrevention: enforced
      lifecycleRules:
        - action:
            type: Delete
          condition:
            age: 30
    options:
      provider: ${provider}
      protect: true
  reportAccess:
    type: gcp:storage:BucketIAMMember
    properties:
      bucket: ${reports.name}
      role: roles/storage.objectUser
      member: serviceAccount:${serviceAccount.email}
    options:
      provider: ${provider}
  images:
    type: gcp:storage:Bucket
    properties:
      location: ${region}
      uniformBucketLevelAccess: true
      publicAccessPrevention: enforced
    options:
      provider: ${provider}
      protect: true
  archive:
    type: gcp:storage:BucketObject
    properties:
      bucket: ${images.name}
      source:
        fn::fileAsset: ${imageArchive}
    options:
      provider: ${provider}
  image:
    type: gcp:compute:Image
    properties:
      rawDisk:
        source: https://storage.googleapis.com/${images.name}/${archive.name}
    options:
      provider: ${provider}
  ingress:
    type: gcp:compute:Firewall
    properties:
      network: ${network.id}
      sourceRanges: [35.191.0.0/16, 130.211.0.0/22]
      targetServiceAccounts: ["${serviceAccount.email}"]
      allows:
        - protocol: tcp
          ports: ['8080']
    options:
      provider: ${provider}
  address:
    type: gcp:compute:GlobalAddress
    options:
      provider: ${provider}
  template:
    type: gcp:compute:InstanceTemplate
    properties:
      metadata:
        is-optimized-config:
          fn::toJSON:
            PUBLIC_URL: https://${domain}
            GCP_PROJECT_ID: ${project}
            GCS_REPORT_BUCKET: ${reports.name}
            SMS_ENABLED: 'false'
            TRUSTED_PROXY_CIDRS: 35.191.0.0/16,130.211.0.0/22,${address.address}/32
      machineType: ${machineType}
      disks:
        - sourceImage: ${image.selfLink}
          boot: true
          autoDelete: true
      networkInterfaces:
        - network: ${network.id}
          subnetwork: ${subnet.id}
      serviceAccount:
        email: ${serviceAccount.email}
        scopes: [cloud-platform]
    options:
      provider: ${provider}
  health:
    type: gcp:compute:HealthCheck
    properties:
      httpHealthCheck:
        port: 8080
        requestPath: /healthz
    options:
      provider: ${provider}
  group:
    type: gcp:compute:InstanceGroupManager
    properties:
      baseInstanceName: is-optimized
      zone: ${zone}
      targetSize: ${instanceCount}
      versions:
        - instanceTemplate: ${template.id}
      namedPorts:
        - name: http
          port: 8080
      autoHealingPolicies:
        healthCheck: ${health.id}
        initialDelaySec: 60
    options:
      provider: ${provider}
  backend:
    type: gcp:compute:BackendService
    properties:
      protocol: HTTP
      portName: http
      healthChecks: ["${health.id}"]
      backends:
        - group: ${group.instanceGroup}
    options:
      provider: ${provider}
  routes:
    type: gcp:compute:URLMap
    properties:
      defaultService: ${backend.id}
    options:
      provider: ${provider}
  certificate:
    type: gcp:compute:ManagedSslCertificate
    properties:
      managed:
        domains: ["${domain}"]
    options:
      provider: ${provider}
  proxy:
    type: gcp:compute:TargetHttpsProxy
    properties:
      urlMap: ${routes.id}
      sslCertificates: ["${certificate.id}"]
    options:
      provider: ${provider}
  frontend:
    type: gcp:compute:GlobalForwardingRule
    properties:
      ipAddress: ${address.address}
      target: ${proxy.id}
      portRange: '443'
    options:
      provider: ${provider}
outputs:
  address: ${address.address}
  reportBucket: ${reports.name}
  runtimeIdentity: ${serviceAccount.email}
