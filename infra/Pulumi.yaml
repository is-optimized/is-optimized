name: is-optimized
runtime: yaml
description: Single Nanos e2-micro pilot; review preview before applying.
config:
  project:
    type: string
    default: iono-run-512901
  region:
    type: string
    default: us-central1
  zone:
    type: string
    default: us-central1-a
  domain:
    type: string
    default: is-optimized.com
  imageArchive:
    type: string
  machineType:
    type: string
    default: e2-micro
  acmeEmail:
    type: string
    default: david@sire.run
  acmeDirectoryURL:
    type: string
    default: https://acme-v02.api.letsencrypt.org/directory
variables:
  # Derive identity from bytes on disk, never from a manually supplied version.
  archiveSHA256:
    fn::invoke:
      function: std:filesha256
      arguments:
        input: ${imageArchive}
      options:
        version: 2.3.2
      return: result
  # https://www.cloudflare.com/ips-v4 — verify again before ingress/DNS cutover.
  cloudflareIPv4:
    - 173.245.48.0/20
    - 103.21.244.0/22
    - 103.22.200.0/22
    - 103.31.4.0/22
    - 141.101.64.0/18
    - 108.162.192.0/18
    - 190.93.240.0/20
    - 188.114.96.0/20
    - 197.234.240.0/22
    - 198.41.128.0/17
    - 162.158.0.0/15
    - 104.16.0.0/13
    - 104.24.0.0/14
    - 172.64.0.0/13
    - 131.0.72.0/22
resources:
  provider:
    type: pulumi:providers:gcp
    properties:
      project: ${project}
      region: ${region}
      zone: ${zone}
    options:
      version: 10.2.0
  computeAPI:
    type: gcp:projects:Service
    properties:
      project: ${project}
      service: compute.googleapis.com
      disableOnDestroy: false
    options:
      provider: ${provider}
  firestoreAPI:
    type: gcp:projects:Service
    properties:
      project: ${project}
      service: firestore.googleapis.com
      disableOnDestroy: false
    options:
      provider: ${provider}
  storageAPI:
    type: gcp:projects:Service
    properties:
      project: ${project}
      service: storage.googleapis.com
      disableOnDestroy: false
    options:
      provider: ${provider}
  iamAPI:
    type: gcp:projects:Service
    properties:
      project: ${project}
      service: iam.googleapis.com
      disableOnDestroy: false
    options:
      provider: ${provider}
  network:
    type: gcp:compute:Network
    properties:
      name: is-optimized
      autoCreateSubnetworks: false
    options:
      provider: ${provider}
      dependsOn: ["${computeAPI}"]
  subnet:
    type: gcp:compute:Subnetwork
    properties:
      network: ${network.id}
      region: ${region}
      ipCidrRange: 10.42.0.0/24
      privateIpGoogleAccess: true
    options:
      provider: ${provider}
  serviceAccount:
    type: gcp:serviceaccount:Account
    properties:
      accountId: is-optimized-runtime
      displayName: is-optimized Nanos runtime
    options:
      provider: ${provider}
      dependsOn: ["${iamAPI}"]
  database:
    type: gcp:firestore:Database
    properties:
      name: (default)
      locationId: ${region}
      type: FIRESTORE_NATIVE
      deleteProtectionState: DELETE_PROTECTION_ENABLED
    options:
      provider: ${provider}
      protect: true
      dependsOn: ["${firestoreAPI}"]
  databaseAccess:
    type: gcp:projects:IAMMember
    properties:
      project: ${project}
      role: roles/datastore.user
      member: serviceAccount:${serviceAccount.email}
    options:
      provider: ${provider}
  pendingIndex:
    type: gcp:firestore:Index
    properties:
      database: ${database.name}
      collection: records
      fields:
        - fieldPath: kind
          order: ASCENDING
        - fieldPath: state
          order: ASCENDING
    options:
      provider: ${provider}
  reports:
    type: gcp:storage:Bucket
    properties:
      name: ${project}-is-optimized-reports
      forceDestroy: false
      location: ${region}
      uniformBucketLevelAccess: true
      publicAccessPrevention: enforced
      lifecycleRules:
        - action:
            type: Delete
          condition:
            age: 30
    options:
      provider: ${provider}
      protect: true
      dependsOn: ["${storageAPI}"]
  reportAccess:
    type: gcp:storage:BucketIAMMember
    properties:
      bucket: ${reports.name}
      role: roles/storage.objectUser
      member: serviceAccount:${serviceAccount.email}
    options:
      provider: ${provider}
  images:
    type: gcp:storage:Bucket
    properties:
      name: ${project}-is-optimized-images
      forceDestroy: false
      location: ${region}
      uniformBucketLevelAccess: true
      publicAccessPrevention: enforced
    options:
      provider: ${provider}
      protect: true
      dependsOn: ["${storageAPI}"]
  archive:
    type: gcp:storage:BucketObject
    properties:
      name: images/${archiveSHA256}/image.tar.gz
      bucket: ${images.name}
      source:
        fn::fileAsset: ${imageArchive}
    options:
      provider: ${provider}
      retainOnDelete: true
  image:
    type: gcp:compute:Image
    properties:
      description: Archive SHA-256 ${archiveSHA256}
      rawDisk:
        source: https://storage.googleapis.com/${images.name}/${archive.name}
    options:
      provider: ${provider}
      retainOnDelete: true
      replaceOnChanges: [rawDisk.source]
      dependsOn: ["${computeAPI}"]
  tlsCache:
    type: gcp:storage:Bucket
    properties:
      name: ${project}-is-optimized-tls
      location: ${region}
      uniformBucketLevelAccess: true
      publicAccessPrevention: enforced
      forceDestroy: false
    options:
      provider: ${provider}
      protect: true
      dependsOn: ["${storageAPI}"]
  tlsCacheAccess:
    type: gcp:storage:BucketIAMMember
    properties:
      bucket: ${tlsCache.name}
      role: roles/storage.objectUser
      member: serviceAccount:${serviceAccount.email}
    options:
      provider: ${provider}
  ingress:
    type: gcp:compute:Firewall
    properties:
      name: is-optimized-cloudflare-web
      network: ${network.id}
      sourceRanges: ${cloudflareIPv4}
      targetServiceAccounts: ["${serviceAccount.email}"]
      allows:
        - protocol: tcp
          ports: ['80', '443']
    options:
      provider: ${provider}
  address:
    type: gcp:compute:Address
    properties:
      name: is-optimized-origin
      region: ${region}
      addressType: EXTERNAL
      networkTier: PREMIUM
    options:
      provider: ${provider}
      dependsOn: ["${computeAPI}"]
  instance:
    type: gcp:compute:Instance
    properties:
      name: is-optimized
      zone: ${zone}
      machineType: ${machineType}
      allowStoppingForUpdate: true
      # Cold-start failures must remain observable through authenticated GCE
      # screenshots even when the guest emits no serial output.
      enableDisplay: true
      desiredStatus: RUNNING
      bootDisk:
        autoDelete: true
        initializeParams:
          image: ${image.selfLink}
          size: 10
          type: pd-standard
      metadata:
        block-project-ssh-keys: 'true'
        serial-port-enable: 'false'
        is-optimized-config:
          fn::toJSON:
            PUBLIC_URL: https://${domain}
            GCP_PROJECT_ID: ${project}
            GCS_REPORT_BUCKET: ${reports.name}
            GCS_TLS_BUCKET: ${tlsCache.name}
            SMS_ENABLED: 'false'
            HTTPS_ENABLED: 'true'
            ACME_EMAIL: ${acmeEmail}
            ACME_HOSTS: ${domain},www.${domain}
            ACME_DIRECTORY_URL: ${acmeDirectoryURL}
            TRUSTED_PROXY_CIDRS:
              fn::join: [',', '${cloudflareIPv4}']
      networkInterfaces:
        - network: ${network.id}
          subnetwork: ${subnet.id}
          accessConfigs:
            - natIp: ${address.address}
              networkTier: PREMIUM
      serviceAccount:
        email: ${serviceAccount.email}
        scopes: [cloud-platform]
      scheduling:
        automaticRestart: true
        onHostMaintenance: MIGRATE
        provisioningModel: STANDARD
    options:
      provider: ${provider}
      dependsOn: ["${databaseAccess}", "${pendingIndex}", "${reportAccess}", "${tlsCacheAccess}", "${ingress}"]
outputs:
  archiveSHA256: ${archiveSHA256}
  archiveObject: ${archive.name}
  imageId: ${image.id}
  imageSelfLink: ${image.selfLink}
  project: ${project}
  zone: ${zone}
  instance: ${instance.name}
  address: ${address.address}
  reportBucket: ${reports.name}
  tlsBucket: ${tlsCache.name}
  runtimeIdentity: ${serviceAccount.email}
